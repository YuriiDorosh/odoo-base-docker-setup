# Redis 7 configuration tuned for development use.
# Production deployments should review every value below.

# Networking
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0

# Persistence — AOF (append-only file) gives the best durability/perf balance.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB snapshots on top of AOF (defence in depth).
save 3600 1
save 300 100
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Slow log (microseconds)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable a couple of dangerous commands in shared dev environments.
rename-command FLUSHALL ""
rename-command CONFIG ""
