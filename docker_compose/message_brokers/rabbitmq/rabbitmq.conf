# RabbitMQ runtime configuration

# Enable Prometheus plugin endpoint on port 15692
prometheus.tcp.port = 15692

# Heartbeat (seconds) negotiated with clients
heartbeat = 60

# Default queue type (set to "quorum" in production for HA)
default_queue_type = classic

# Memory / disk thresholds
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.5

# Load predefined topology
management.load_definitions = /etc/rabbitmq/definitions.json
